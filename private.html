<!-- PRIVATE PAGE (save as private.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Gallery</title>

<style>

.slideshow-container {
  width: 100%;
  max-width: 800px;
  margin: 30px auto;
  text-align: center;
}

.slideshow-container img {
  width: 100%;
  height: auto;
  border-radius: 10px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  transition: opacity 0.8s ease;
}

</style>
</head>


<body>
<h1>Private Photo Gallery</h1>
<p>This page is protected. Only approved users can view it.</p>
<section class="slideshow-container">
  <img id="slide" src="" alt="Reunion photos" />
</section>
</div>

<script>
let images = [];
let index = 0;

fetch("reunion97.json")
  .then(res => res.json())
  .then(data => {
    images = data;

    if (images.length > 0) {
      document.getElementById("slide").src = images[0];

      setInterval(() => {
        index = (index + 1) % images.length;
        document.getElementById("slide").src = images[index];
      }, 4000);
    }
  });
</script>

</body>
</html>
